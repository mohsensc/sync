[project]
name = "agent-presence"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["websockets>=13.0"]

[project.scripts]
agent-presence-relay = "agent_presence.serve:main"
# Short on purpose. It gets typed mid-session, next to git.
ap = "agent_presence.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.100", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_presence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
