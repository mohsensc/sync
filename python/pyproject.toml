[project]
name = "agent-presence"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["websockets>=13.0"]

[project.scripts]
agent-presence-relay = "agent_presence.serve:main"
# Short on purpose. It gets typed mid-session, next to git.
ap = "agent_presence.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.100", "pytest-asyncio>=0.24"]
# Rung 4's embedding backend (agent_presence.embedding_similarity). Not
# pulled in by a plain install - see that module's docstring for why it
# isn't the default and similarity.py's default_similarity() for where the
# lazy import lives.
embedding = ["fastembed>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_presence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
