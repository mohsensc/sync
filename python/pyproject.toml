[project]
name = "agent-presence"
version = "0.0.0"
requires-python = ">=3.12"
# mcp 2.0 replaced the decorator server API with on_* callbacks. mcp_server.py
# targets the callback form, so 1.x won't work.
dependencies = ["websockets>=13.0", "mcp>=2.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.100", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_presence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
