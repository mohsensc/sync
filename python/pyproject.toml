[project]
name = "agent-presence"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
# Short on purpose. It gets typed mid-session, next to git.
ap = "agent_presence.cli:main"

[project.optional-dependencies]
# websockets is a test-only dependency now: the black-box suite
# (test_e2e.py, test_serve.py, test_relay_restart.py) is a websockets
# *client* talking to the real gorelay binary over the wire. Nothing left
# in src/agent_presence imports it — the Python relay it served is gone
# (#40).
dev = ["pytest>=8.0", "hypothesis>=6.100", "pytest-asyncio>=0.24", "websockets>=13.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_presence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
