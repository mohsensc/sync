<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent Presence — the office</title>
<style>
  html,body{margin:0;height:100%;background:#F0ECE6;overflow:hidden;
    font:14px/1.5 ui-sans-serif,-apple-system,Segoe UI,sans-serif;color:#35455C}
  #c{display:block;width:100%;height:100%;cursor:grab}
  #c:active{cursor:grabbing}
  #hud{position:fixed;left:18px;top:16px;background:#fffdfaee;border:1px solid #C3B39B;
    border-radius:10px;padding:12px 14px;max-width:290px;box-shadow:0 6px 24px #4a1f3d18}
  #hud h1{font-size:15px;margin:0 0 3px;letter-spacing:-.01em}
  #hud p{margin:0 0 10px;font-size:12px;color:#6b5f56}
  .row{display:flex;gap:6px;flex-wrap:wrap}
  .row+.row{margin-top:6px}
  button{font:inherit;font-size:12px;padding:5px 10px;border-radius:6px;
    border:1px solid #C3B39B;background:#fff;color:#35455C;cursor:pointer}
  button:hover{background:#E9E0CE}
  button[aria-pressed="true"]{background:#35455C;color:#F0ECE6;border-color:#35455C}
  #bDemo{background:#35455C;color:#F0ECE6;border-color:#35455C;font-weight:600}
  #bDemo:hover{background:#4A1F3D;border-color:#4A1F3D}
  #log{position:fixed;left:18px;bottom:16px;font:11px ui-monospace,monospace;color:#6b5f56;
    background:#fffdfacc;border-radius:8px;padding:7px 10px;max-width:36vw}
  #caption{position:fixed;left:50%;transform:translateX(-50%);bottom:34px;
    max-width:min(720px,86vw);text-align:center;
    background:#35455Cf2;color:#F0ECE6;border-radius:10px;
    padding:11px 20px;font-size:15px;line-height:1.45;letter-spacing:-.005em;
    box-shadow:0 8px 30px #4a1f3d33;opacity:0;transition:opacity .35s;pointer-events:none}
  #caption.on{opacity:1}

  /* ---- replay versus card -------------------------------------------
     Off by default (see replay-card.js — createReplayCard returns a
     no-op unless ?vcard=split|strip is set), so nothing here changes the
     look of a plain checkout. Two variants, one shared box: 'split' is a
     wide lower-third that slides its two halves in from the edges,
     'strip' is one dense line, both replacing the plain #caption text
     for the duration of a reel replay (see office.html's replayEvent). */
  .rcard{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(14px);
    max-width:min(720px,90vw);opacity:0;pointer-events:none;
    transition:opacity .3s,transform .3s;font:14px ui-sans-serif,sans-serif;color:#F0ECE6}
  .rcard.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .rcard-badge{font:700 10px ui-monospace,monospace;text-transform:uppercase;
    letter-spacing:.04em;border-radius:999px;padding:2px 8px}
  .rcard.split{display:flex;align-items:stretch;gap:0;
    background:#35455Cf2;border-radius:12px;box-shadow:0 8px 30px #4a1f3d33;overflow:hidden}
  .rcard.split .rcard-side{flex:1 1 0;padding:12px 18px;display:flex;flex-direction:column;
    gap:2px;min-width:0;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
  .rcard.split .rcard-side b{font-size:14px;letter-spacing:-.01em}
  .rcard.split .rcard-side span{font:11px ui-monospace,monospace;color:#C7CDD8;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rcard.split .rcard-a{text-align:right;align-items:flex-end;
    border-right:1px solid #ffffff22}
  .rcard.split .rcard-b{text-align:left;align-items:flex-start}
  .rcard.split:not(.on) .rcard-a{transform:translateX(-24px)}
  .rcard.split:not(.on) .rcard-b{transform:translateX(24px)}
  .rcard.split .rcard-mid{flex:0 0 auto;padding:10px 16px;display:flex;
    flex-direction:column;align-items:center;gap:5px;justify-content:center}
  .rcard.split .rcard-verdict{font-size:12px;color:#F0ECE6;text-align:center;max-width:180px}
  .rcard.strip{background:#35455Cf2;border-radius:999px;padding:8px 16px;
    box-shadow:0 6px 20px #4a1f3d33;display:flex;align-items:center;gap:8px;
    font:12px ui-monospace,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #mode{position:fixed;left:50%;top:16px;transform:translateX(-50%);
    background:#35455Cf2;color:#F0ECE6;border-radius:999px;padding:6px 16px;
    font:600 11px ui-monospace,monospace;letter-spacing:.04em;text-transform:uppercase;
    box-shadow:0 4px 14px #4a1f3d22}
  #mode.demo{background:#C0762Af2}
  #mode.connecting{background:#8A94A3f2}

  /* ---- highlight reel ----------------------------------------------
     Top-right, over the scene — same HUD look as #hud (cream card,
     taupe border), sized to sit well clear of #mode's centered pill.
     Absorbs the old #beat readout as its footer line, see reel.js. */
  #reel{position:fixed;right:18px;top:16px;width:308px;max-height:60vh;
    background:#fffdfaee;border:1px solid #C3B39B;border-radius:10px;
    box-shadow:0 6px 24px #4a1f3d18;display:flex;flex-direction:column;
    overflow:hidden}
  .reel-head{display:flex;align-items:baseline;justify-content:space-between;
    padding:11px 14px 0}
  .reel-title{font-size:14px;font-weight:600;letter-spacing:-.01em;color:#35455C}
  .reel-head-right{display:flex;align-items:center;gap:6px}
  .reel-count{font:11px ui-monospace,monospace;color:#8a94a3}
  .reel-skin-btn{font:600 10px ui-monospace,monospace;padding:3px 7px;border-radius:6px;
    border:1px solid #C3B39B;background:#fff;color:#6b5f56;cursor:pointer;
    text-transform:uppercase;letter-spacing:.02em}
  .reel-skin-btn:hover{background:#E9E0CE}
  .reel-filters{display:flex;align-items:center;gap:6px;padding:8px 14px 10px;
    border-bottom:1px solid #E9E0CE;flex-wrap:wrap}
  .reel-chips{display:flex;gap:4px;flex-wrap:wrap}
  .reel-chip{font:600 10px ui-monospace,monospace;padding:3px 7px;border-radius:999px;
    border:1px solid #C3B39B;background:#fff;color:#6b5f56;cursor:pointer;
    text-transform:uppercase;letter-spacing:.02em}
  .reel-chip:hover{background:#E9E0CE}
  .reel-chip.on{background:#35455C;color:#F0ECE6;border-color:#35455C}
  .reel-human{font:11px ui-sans-serif,sans-serif;color:#35455C;background:#fff;
    border:1px solid #C3B39B;border-radius:6px;padding:3px 6px;margin-left:auto;
    max-width:110px}
  .reel-list{overflow-y:auto;overflow-x:hidden}
  .reel-item{border-bottom:1px solid #F0ECE6}
  .reel-item:last-child{border-bottom:0}
  .reel-row{display:flex;align-items:flex-start;gap:8px;width:100%;
    text-align:left;font:inherit;border:0;
    background:none;cursor:pointer;padding:9px 14px}
  .reel-row:hover{background:#F7F4EC}
  .reel-row-open{background:#F7F2E7}
  .reel-row-open:hover{background:#F7F2E7}
  .reel-row:focus-visible,.reel-chip:focus-visible,.reel-human:focus-visible,
  .reel-replay-btn:focus-visible,.reel-more:focus-visible{
    outline:2px solid #35455C;outline-offset:-2px;border-radius:4px}
  .reel-badge{flex:0 0 auto;font:700 10px ui-monospace,monospace;padding:2px 6px;
    border-radius:5px;margin-top:1px}
  .reel-body{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
  .reel-line1{display:flex;align-items:center;gap:5px;font-size:12px;color:#35455C;
    flex-wrap:wrap}
  .reel-who{font-weight:600}
  .reel-vs{color:#8a94a3;font-size:10px}
  .reel-src{font:600 9px ui-monospace,monospace;padding:1px 5px;border-radius:4px;
    text-transform:uppercase;letter-spacing:.03em}
  .reel-src-live{background:#DCEFE3;color:#2E7D50}
  .reel-src-gen{background:#EEF0F3;color:#6b5f56}
  .reel-line2{display:flex;align-items:center;gap:5px;font-size:11px;color:#6b5f56;
    min-width:0}
  .reel-path{font-family:ui-monospace,monospace;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;max-width:150px}
  .reel-dot{opacity:.6}
  .reel-res{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .reel-time{flex:0 0 auto;font:11px ui-monospace,monospace;color:#8a94a3;
    margin-top:1px}
  .reel-empty{padding:22px 14px;text-align:center;font-size:12px;color:#8a94a3}
  .reel-foot{padding:7px 14px;font:11px ui-monospace,monospace;color:#6b5f56;
    border-top:1px solid #E9E0CE}
  .reel-foot b{color:#35455C}

  /* ---- reel v2: detail card, now-playing, arrivals, long lists -------
     Stays inside the cream/slate/mustard palette already established
     above — new states, not a new look. */
  .reel-row-new{animation:reel-arrive 1.6s ease-out}
  @keyframes reel-arrive{
    0%{background:#DCEFE3}
    100%{background:transparent}
  }
  .reel-row-playing{position:relative;background:#FBF2DE}
  .reel-row-playing::before{content:'';position:absolute;left:0;top:0;bottom:0;
    width:3px;background:#D6B45C}
  @media (prefers-reduced-motion: no-preference){
    .reel-row-playing::before{animation:reel-pulse 1.1s ease-in-out infinite}
  }
  @keyframes reel-pulse{0%,100%{opacity:.55}50%{opacity:1}}
  .reel-detail{padding:2px 14px 12px 38px;display:flex;flex-direction:column;gap:7px}
  .reel-detail-row{display:flex;align-items:baseline;gap:8px;font-size:11px}
  .reel-detail-label{flex:0 0 auto;width:48px;color:#8a94a3;
    text-transform:uppercase;letter-spacing:.04em;font:700 9px ui-monospace,monospace}
  .reel-detail-value{color:#35455C;word-break:break-word}
  .reel-detail-path{font-family:ui-monospace,monospace}
  .reel-detail-explain{margin:0;font-size:12px;line-height:1.4;color:#6b5f56;
    padding:8px 10px;background:#fff;border:1px solid #E9E0CE;border-radius:7px}
  .reel-replay-btn{align-self:flex-start;margin-top:2px;font:700 11px ui-monospace,monospace;
    padding:5px 12px;border-radius:999px;border:1px solid #35455C;
    background:#35455C;color:#F0ECE6;cursor:pointer}
  .reel-replay-btn:hover{background:#4A1F3D;border-color:#4A1F3D}
  .reel-replay-btn:disabled{background:#C3B39B;border-color:#C3B39B;cursor:default}
  .reel-more{display:block;width:100%;font:600 11px ui-monospace,monospace;
    padding:9px 14px;border:0;border-top:1px solid #E9E0CE;background:#FAF7F0;
    color:#6b5f56;cursor:pointer;text-align:center}
  .reel-more:hover{background:#F0ECE6;color:#35455C}

  /* Rung badge colors, base (paper) case. Unscoped so they're also the
     fallback if a skin class is somehow missing — reel.js only ever writes
     data-rung on the badge, never a color, see mountReel's doc comment. */
  .reel-badge[data-rung="0"]{color:#8A94A3;background:#EEF0F3}
  .reel-badge[data-rung="1"]{color:#5C8C74;background:#EAF2ED}
  .reel-badge[data-rung="2"]{color:#B98F2A;background:#FBF2DE}
  .reel-badge[data-rung="3"]{color:#C0762A;background:#FBEBDA}
  .reel-badge[data-rung="4"]{color:#B0403A;background:#F9E5E3}

  /* ---- reel skins -----------------------------------------------------
     Three switchable looks, picked with ?skin=glass|ticker or the cycle
     button reel.js draws in the head. 'paper' (above) is every rule
     already written — it needs no .reel-skin-paper block of its own.
     reel-skins-test.html keeps its own copy of this whole section so it
     can render all three without loading office.html's 3D scene. */

  /* glass — dark translucent card over the 3D scene. Every text token below
     was picked against the .reel-skin-glass background itself (rgba(20,26,
     36,.78) plus blur, so effectively a near-opaque dark ground regardless
     of what's moving underneath) — rung badges are the only saturated
     color, everything else is white at varying opacity. */
  /* #reel qualifier, not just .reel-skin-glass: the skin class lands on
     the #reel element itself (see mountReel's classList.add), and #reel's
     own background/border/box-shadow above are an ID selector — a bare
     class selector here loses that specificity fight and silently no-ops,
     which is exactly what happened until this was caught in the browser
     (round 7 integration: glass rendered as plain cream paper, only the
     rung badges took the glass colors, because badge rules are
     descendant selectors and aren't fighting the #reel rule directly). */
  #reel.reel-skin-glass{background:rgba(20,26,36,.78);border-color:rgba(255,255,255,.14);
    backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);
    box-shadow:0 16px 44px rgba(0,0,0,.5)}
  .reel-skin-glass .reel-title{color:#F3F5F8}
  .reel-skin-glass .reel-count{color:rgba(243,245,248,.5)}
  .reel-skin-glass .reel-skin-btn{background:rgba(255,255,255,.08);
    border-color:rgba(255,255,255,.18);color:rgba(243,245,248,.75)}
  .reel-skin-glass .reel-skin-btn:hover{background:rgba(255,255,255,.16)}
  .reel-skin-glass .reel-filters{border-color:rgba(255,255,255,.12)}
  .reel-skin-glass .reel-chip{background:rgba(255,255,255,.06);
    border-color:rgba(255,255,255,.18);color:rgba(243,245,248,.72)}
  .reel-skin-glass .reel-chip:hover{background:rgba(255,255,255,.13)}
  .reel-skin-glass .reel-chip.on{background:rgba(243,245,248,.92);color:#141A24;
    border-color:rgba(243,245,248,.92)}
  .reel-skin-glass .reel-human{background:rgba(255,255,255,.06);
    border-color:rgba(255,255,255,.18);color:#F3F5F8}
  .reel-skin-glass .reel-item{border-color:rgba(255,255,255,.08)}
  .reel-skin-glass .reel-row:hover{background:rgba(255,255,255,.05)}
  .reel-skin-glass .reel-row-open,.reel-skin-glass .reel-row-open:hover{
    background:rgba(255,255,255,.09)}
  .reel-skin-glass .reel-who{color:#F3F5F8}
  .reel-skin-glass .reel-vs{color:rgba(243,245,248,.4)}
  .reel-skin-glass .reel-src-live{background:rgba(127,224,168,.16);color:#8FE3B2}
  .reel-skin-glass .reel-src-gen{background:rgba(255,255,255,.08);color:rgba(243,245,248,.55)}
  .reel-skin-glass .reel-path{color:rgba(243,245,248,.72)}
  .reel-skin-glass .reel-dot{color:rgba(243,245,248,.3)}
  .reel-skin-glass .reel-res{color:rgba(243,245,248,.6)}
  .reel-skin-glass .reel-time{color:rgba(243,245,248,.4)}
  .reel-skin-glass .reel-empty{color:rgba(243,245,248,.45)}
  .reel-skin-glass .reel-foot{border-color:rgba(255,255,255,.1);color:rgba(243,245,248,.5)}
  .reel-skin-glass .reel-foot b{color:#F3F5F8}
  .reel-skin-glass .reel-row-playing{background:rgba(214,180,92,.14)}
  .reel-skin-glass .reel-row-playing::before{background:#E4BD5C}
  .reel-skin-glass .reel-row-new{animation:reel-arrive-glass 1.6s ease-out}
  @keyframes reel-arrive-glass{0%{background:rgba(127,224,168,.22)}100%{background:transparent}}
  .reel-skin-glass .reel-detail-explain{background:rgba(255,255,255,.05);
    border-color:rgba(255,255,255,.12);color:rgba(243,245,248,.72)}
  .reel-skin-glass .reel-detail-label{color:rgba(243,245,248,.4)}
  .reel-skin-glass .reel-detail-value{color:#F3F5F8}
  .reel-skin-glass .reel-replay-btn{background:#F3F5F8;color:#141A24;border-color:#F3F5F8}
  .reel-skin-glass .reel-replay-btn:hover{background:#DCE6F0}
  .reel-skin-glass .reel-replay-btn:disabled{background:rgba(255,255,255,.18);
    color:rgba(20,26,36,.6);border-color:rgba(255,255,255,.18)}
  .reel-skin-glass .reel-more{background:rgba(255,255,255,.03);
    border-color:rgba(255,255,255,.1);color:rgba(243,245,248,.5)}
  .reel-skin-glass .reel-more:hover{background:rgba(255,255,255,.08);color:#F3F5F8}
  .reel-skin-glass .reel-badge[data-rung="0"]{color:#B7C2D1;background:rgba(255,255,255,.08)}
  .reel-skin-glass .reel-badge[data-rung="1"]{color:#7FE0A8;background:rgba(127,224,168,.14)}
  .reel-skin-glass .reel-badge[data-rung="2"]{color:#F0C55C;background:rgba(240,197,92,.16)}
  .reel-skin-glass .reel-badge[data-rung="3"]{color:#F3934D;background:rgba(243,147,77,.16)}
  .reel-skin-glass .reel-badge[data-rung="4"]{color:#F1685E;background:rgba(241,104,94,.16)}

  /* ticker — dense monospace incident log. No card chrome (flat panel,
     hairline border, no shadow), tight single-line rows: line1/line2
     collapse into one flex row via display:contents on the wrapper spans,
     so the markup stays identical to the other two skins and only the
     layout changes. Source tags are dropped here — R-badge + who + path +
     resolution + time is already dense enough without them. */
  /* same #reel-specificity fix as glass, above. */
  #reel.reel-skin-ticker{background:#0A0E13;border:1px solid #1B2430;border-radius:4px;
    box-shadow:none;font-family:ui-monospace,monospace}
  .reel-skin-ticker .reel-head{border-bottom:1px solid #1B2430;padding:7px 10px 6px}
  .reel-skin-ticker .reel-title{font-size:11px;letter-spacing:.08em;
    text-transform:uppercase;color:#7FE0A8}
  .reel-skin-ticker .reel-count{color:#4B5A6B}
  .reel-skin-ticker .reel-skin-btn{background:#111820;border-color:#26313F;
    color:#8291A3;border-radius:3px}
  .reel-skin-ticker .reel-skin-btn:hover{background:#1B2430}
  .reel-skin-ticker .reel-filters{padding:5px 10px;border-color:#1B2430}
  .reel-skin-ticker .reel-chip{font-size:9px;padding:2px 5px;border-radius:3px;
    border-color:#26313F;background:#111820;color:#8291A3}
  .reel-skin-ticker .reel-chip:hover{background:#1B2430}
  .reel-skin-ticker .reel-chip.on{background:#1B2430;color:#DCE6F0;border-color:#3A4B5E}
  .reel-skin-ticker .reel-human{background:#111820;border-color:#26313F;
    color:#DCE6F0;border-radius:3px}
  .reel-skin-ticker .reel-item{border-color:#131A22}
  .reel-skin-ticker .reel-row{padding:3px 10px;gap:7px;font-size:11px;align-items:baseline}
  .reel-skin-ticker .reel-row:hover{background:#101720}
  .reel-skin-ticker .reel-row-open,.reel-skin-ticker .reel-row-open:hover{background:#121B26}
  .reel-skin-ticker .reel-badge{font-size:9px;padding:1px 4px;border-radius:3px;margin-top:0}
  .reel-skin-ticker .reel-body{flex-direction:row;align-items:baseline;gap:6px;
    min-width:0;overflow:hidden}
  .reel-skin-ticker .reel-line1,.reel-skin-ticker .reel-line2{display:contents}
  /* who/vs/res need their own overflow+nowrap here (not just inherited)
     because reel-line1/line2's display:contents makes them direct flex
     items of the row-direction reel-body — without overflow:hidden the
     browser falls back to each item's min-content size, which for "who"
     breaks at the "/" in "priya/agent-2" and wraps to two lines instead
     of shrinking. Caught in the browser at the real 308px panel width;
     reel-skins-test.html's wider layout never showed it. */
  .reel-skin-ticker .reel-who{color:#DCE6F0;font-size:11px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;max-width:78px}
  .reel-skin-ticker .reel-vs{color:#425063;white-space:nowrap;flex:0 0 auto}
  .reel-skin-ticker .reel-src{display:none}
  .reel-skin-ticker .reel-path{color:#7FE0A8;max-width:120px}
  .reel-skin-ticker .reel-dot{color:#2F3B48}
  .reel-skin-ticker .reel-res{color:#8291A3;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;max-width:96px}
  .reel-skin-ticker .reel-time{color:#425063;font-size:10px}
  .reel-skin-ticker .reel-empty{color:#425063}
  .reel-skin-ticker .reel-foot{border-color:#1B2430;color:#5A6B7D}
  .reel-skin-ticker .reel-row-playing{background:#1B2A1E}
  .reel-skin-ticker .reel-row-playing::before{background:#7FE0A8}
  .reel-skin-ticker .reel-row-new{animation:reel-arrive-ticker 1.6s ease-out}
  @keyframes reel-arrive-ticker{0%{background:#12301F}100%{background:transparent}}
  .reel-skin-ticker .reel-detail{padding:2px 10px 8px 32px}
  .reel-skin-ticker .reel-detail-explain{background:#0F161D;border-color:#1B2430;
    color:#8291A3;border-radius:4px}
  .reel-skin-ticker .reel-detail-label{color:#425063}
  .reel-skin-ticker .reel-detail-value{color:#DCE6F0}
  .reel-skin-ticker .reel-replay-btn{background:#173B2A;border-color:#2B6B4A;
    color:#7FE0A8;border-radius:3px}
  .reel-skin-ticker .reel-replay-btn:hover{background:#1F4E38}
  .reel-skin-ticker .reel-more{background:#0D1319;border-color:#1B2430;color:#5A6B7D}
  .reel-skin-ticker .reel-more:hover{background:#101720;color:#8291A3}
  .reel-skin-ticker .reel-badge[data-rung="0"]{color:#93A2B4;background:#151C24}
  .reel-skin-ticker .reel-badge[data-rung="1"]{color:#66C990;background:#12251C}
  .reel-skin-ticker .reel-badge[data-rung="2"]{color:#E4BD5C;background:#241D10}

const loader = new GLTFLoader()
const meshes = []
const props = {}
const desks = []                 // click targets: { label, group, seat:[x,z,yaw] }
let pending = 0, done = 0

// A zone slot stands 1.05 m off the desk. Sitting there leaves the character
// marooned in the aisle, so pull the seat in. The sit clip then takes the
// pelvis 22cm back and the knees land under the desk.
const SEAT_PULL = 0.30
function seatFor(slot, pos) {
  const dx = pos[0] - slot[0], dz = pos[2] - slot[1]
  const l = Math.hypot(dx, dz) || 1
  return [ slot[0] + dx/l*SEAT_PULL, slot[1] + dz/l*SEAT_PULL, slot[2] ]
}

/**
 * Every one of these GLBs ships metalness = 1, roughness = 1, and the character
 * additionally carries an emissiveMap at full white emissive. That combination
 * is effectively unlit: metalness 1 kills the diffuse term, so the only thing
 * lighting the mesh is a rough specular lobe plus, on the character, its own
 * baked emissive. It is why the figures looked like flat stickers and why the
 * shadows read as muddy — there was barely any directional shading to shadow.
 *
 * Normalising to a dielectric puts the diffuse term back and lets the key light
 * do the modelling. The emissive is kept at a low intensity because the clay
 * look does live partly in that map; dropping it to zero makes the characters
 * noticeably drabber than the reference renders.
 */
function fixMaterial(m) {
  if (!m || !m.isMeshStandardMaterial) return m
  m.metalness = 0
  m.roughness = 0.9
  m.emissiveIntensity = m.emissiveMap ? 0.18 : 0

}

    if (!n.isMesh && !n.isSkinnedMesh) return

function place(gltf, spec) {
  const o = gltf.scene
  fixMaterials(o)

  // degenerate height and h/size.y explodes. Update before measuring.
  o.updateMatrixWorld(true)
  const box = new THREE.Box3().setFromObject(o)
  const size = box.getSize(new THREE.Vector3())
  const c = box.getCenter(new THREE.Vector3())
  const s = spec.h / Math.max(size.y, 1e-4)
  const g = new THREE.Group()
  o.position.set(-c.x, -box.min.y, -c.z)
  o.scale.setScalar(1)
  g.add(o); g.scale.setScalar(s)
  if (spec.sx) o.scale.x = spec.sx
  g.position.set(spec.pos[0], spec.pos[1], spec.pos[2])
  g.rotation.y = spec.rot || 0
  o.traverse(n => { if (n.isMesh) { n.castShadow = true; n.receiveShadow = true; meshes.push(n) } })
  scene.add(g)
  g.userData.scale = s
  return g
}

function load(spec) {
  pending++
  loader.load(spec.url, gltf => {
    const g = place(gltf, spec)
    if (spec.id) props[spec.id] = g
    if (spec.desk) desks.push({ label:spec.desk, group:g, seat:seatFor(spec.slot, spec.pos) })

  }, undefined, e => { done++; console.warn('failed', spec.url, e); tally() })
}

  logEl.textContent = `${done}/${pending} objects loaded`
  setupCast()
}
PLAN.forEach(load)

// ---- agents -----------------------------------------------------------
// Five demo agents plus three background characters that just idle so the

const AGENT_CAST = [

    pos:[-5.8, 0.8], yaw: Math.PI/2, act:'reading' },
  { id:'b2', name:'indexer',   role:'walking the tree',     color:P.mustard,
    seat:'desk 2', act:'typing' },
  { id:'b3', name:'archivist', role:'nothing, for now',     color:P.rose,
    seat:'desk 5', act:'sleeping' },
]

const world = new World()
const agents = []                // demo cast, in AGENT_CAST order
const extras = []                // background cast

/**
 * Height-normalised character in an UNSCALED outer group. agent.js hangs a
 * badge sprite and a floor halo off this root, so it has to be world-scale;
 * a scaled root would shrink them by the same factor.
 */
function makeCharacterRoot(gltfScene, height = 1.68, bodyColor = null) {
  const o = gltfScene
  // SkeletonUtils.clone shares materials with the source, so tinting one clone
  // would repaint all eight. Clone the material per character first.
  o.traverse(n => {
    if (!n.isMesh && !n.isSkinnedMesh) return
    n.material = n.material.clone()
    fixMaterial(n.material)
    if (bodyColor != null) {
      // Multiply the baked clay texture rather than replace it.
      //
      // The lerp toward white is small on purpose. Colour maths here runs in
      // linear space, where a half-way lerp to white comes out as a near-white
      // pastel — at 0.5 all eight figures were still effectively cream and the
      // whole point was lost. 0.18 keeps the palette hue legible while leaving
      // enough range in the texture for the face to survive on the dark
      // entries like navy.
      n.material.color.set(bodyColor).lerp(new THREE.Color(0xffffff), 0.18)
      n.material.needsUpdate = true
    }
  })
  o.updateMatrixWorld(true)                       // never measure a stale clone
  const box = new THREE.Box3().setFromObject(o)
  const size = box.getSize(new THREE.Vector3())
  const c = box.getCenter(new THREE.Vector3())
  const s = height / Math.max(size.y, 1e-4)
  const inner = new THREE.Group()
  o.position.set(-c.x, -box.min.y, -c.z)
  inner.add(o); inner.scale.setScalar(s)
  const root = new THREE.Group()
  root.add(inner)
  o.traverse(n => { if (n.isMesh) { n.castShadow = true; n.receiveShadow = true; meshes.push(n) } })
  root.userData.scale = s
  return root
}

// The seated background characters need their desks placed first, and the
// interaction layer needs every prop, so setup waits for the whole load.
let charGLTF = null, interaction = null
function setupCast() {
  if (!charGLTF || interaction || done < pending) return
  const gltf = charGLTF
  for (const spec of AGENT_CAST) {

    scene.add(root)
    agents.push(world.add(createAgent({
      root, id: spec.id, name: spec.name, color: spec.color,
      pos: spec.start, yaw: Math.PI / 2, height: 1.68,
      scale: root.userData.scale,
    })))
  }
  for (const b of BACKGROUND) {
    const root = makeCharacterRoot(skinnedClone(gltf.scene), 1.68, b.color)
    scene.add(root)
    // A seated one starts on its desk's seat, already facing the desk.
    const d = b.seat ? deskNamed(b.seat) : null
    const a = createAgent({
      root, id:b.id, name:b.name, role:b.role, color:b.color, height:1.68,
      pos: d ? [d.seat[0], d.seat[1]] : b.pos,
      yaw: d ? d.seat[2] : b.yaw,
      scale: root.userData.scale,
    })
    if (b.act) a.act(b.act, { fade:0 })
    if (d) a.homeDesk = d
    extras.push(world.add(a))
  }

  // Set dressing needs the real seat positions, so it waits for the desks.
  // Built before attachInteraction so nothing here lands in the pick list —
  // a chair that swallowed a floor click would break "send them there".
  const dressing = buildDressing({
    desks, wallZ: WALL_Z, wallX: WALL_X, deskTop: DESK_TOP,
    // The desks the background cast actually sits at get their chairs pulled
    // out; the rest tuck under. See buildDressing for why this isn't uniform.
    occupied: BACKGROUND.filter(b => b.seat).map(b => b.seat),
  })
  scene.add(dressing.group)
  dressing.meshes.forEach(m => meshes.push(m))
  window.__dressing = dressing

  interaction = attachInteraction({
    canvas, camera, scene, world, floor, rug, props, desks,
    log: s => { logEl.textContent = s },
  })
  window.__interact = interaction
  window.__ready = true
  initLive()
}

// ---- camera / interaction --------------------------------------------
// Default framing shows the whole floor plate. At pitch 0.42 with the target on
// the desk bank the open +z edge fell off the bottom of the frame.
let yaw = 0.78, pitch = 0.46, dist = 1.14, spin = false, top = false, wire = false
// The room is a cutaway, open on +x and +z only. Orbiting past these puts the
// camera behind a wall and the view goes blank, so the arc is clamped.
const YAW_MIN = 0.18, YAW_MAX = 1.39
let spinDir = 1
const target = new THREE.Vector3(0.2, 1.0, 0.7)
const goal = { target: target.clone(), dist: 1.14, yaw: 0.78, active: false }
// Down from 21 with the room. At the old radius the shrunken office sat in the
// middle of the frame with a wide band of empty background around it.
const RADIUS = 18

/** Demo camera: ease toward a floor point at a given zoom and yaw. */
function focus([x, z], d = 1, y = null) {
  goal.target.set(x, 1.15, z)
  goal.dist = d
  if (y != null) goal.yaw = Math.max(YAW_MIN, Math.min(YAW_MAX, y))
  goal.active = true
}

// ---- reel replay camera -------------------------------------------------
// A reel click frames the pair for the whole two-act beat and eases back
// out once it's over — reusing focus()'s own easing, not a second camera
// system. `replayEnc` is the encounter the render loop watches each frame
// (see the `phase === 'done'` check by the camera lines below) so the
// release fires the instant World.replay()'s whole chain finishes, not on
// a fixed timer that could clip a longer or shorter beat.
let camReturn = null   // { target, dist, yaw } to ease back to, or null
let replayEnc = null   // encounter camera framing is currently following

/** Ease in on the midpoint between two agents, tight enough that a two-
 *  person beat reads clearly. Yaw is left alone: camera.lookAt(target)
 *  already centres the pair regardless of orbit angle, and the arc is
 *  clamped to angles that stay inside the room anyway (see YAW_MIN/MAX). */
function focusPair(a, b, enc) {
  if (!camReturn) camReturn = { target: target.clone(), dist, yaw }
  replayEnc = enc
  const mx = (a.pos.x + b.pos.x) / 2, mz = (a.pos.z + b.pos.z) / 2
  focus([mx, mz], 0.55)
}

function releaseCameraFocus() {
  if (camReturn) focus([camReturn.target.x, camReturn.target.z], camReturn.dist, camReturn.yaw)
  camReturn = null
  replayEnc = null
}

/** Send the selection (or the first agent) to high five whoever is nearest. */
function pairUp(a = interaction && interaction.selected) {
  a = a || world.agents[0]
  if (!a) return
  const b = world.agents
    .filter(x => x!==a && !x.busy && !x.seated && !x.moving)
    .sort((p,q)=>dist2(p,a)-dist2(q,a))[0]
  if (!b) { logEl.textContent = 'nobody free to high five'; return }
  a.lastGreet = b.lastGreet = -99
  world.highfive(a, b)
  logEl.textContent = `${a.name} + ${b.name} → high five`
  return [a.id, b.id]
}
const dist2 = (p,q) => (p.pos.x-q.pos.x)**2 + (p.pos.z-q.pos.z)**2

// ---- live ---------------------------------------------------------------
// Points the room at the relay. demo.js is the fallback, not the default: if
// nothing answers within LIVE_TIMEOUT_MS, or the relay hangs up later, the
// scene falls back to the scripted demo and the #mode badge says so — it
// never quietly sits there looking staffed when nobody is home.
const LIVE_TIMEOUT_MS = 1500
const director = new Live.LiveDirector()
const liveAgents = new Map()     // agent id -> Agent, live-spawned characters only
const liveMeshes = new Map()     // agent id -> meshes pushed into the shared `meshes` array
let liveMode = false
let liveConn = null
let fallbackTimer = null

function setMode(kind, text) { modeEl.className = kind; modeEl.textContent = text }

/** Height-normalised, hair-tinted character for one live agent id. Reuses
 *  the exact same rig setup the demo cast gets — same clone, same tint math,
 *  same shadow flags — so a live figure and a demo figure are indistinguishable
 *  except for what they are actually doing. */
function spawnLive(id, human) {
  if (!charGLTF) return null      // frame arrived before the rig finished loading
  const color = Live.hairFor(human)
  const before = meshes.length
  const root = makeCharacterRoot(skinnedClone(charGLTF.scene), 1.68, color)
  scene.add(root)
  liveMeshes.set(id, meshes.slice(before))
  const a = world.add(createAgent({
    root, id, name: id, role: human, color, height: 1.68,
    // Enter from reception so an arrival reads as an arrival, same as
    // characters.ts's CharacterRegistry does for the capsule viewer.
    pos: [Z.ZONES.reception.at[0], Z.ZONES.reception.at[1]], yaw: Math.PI / 2,
    scale: root.userData.scale,
  }))
  liveAgents.set(id, a)
  if (interaction) interaction.addAgent(a)
  return a
}

/** Undo spawnLive(): drop the pick target, the world entry, the slot, and
 *  the per-character materials (cloned per instance, so safe to dispose —
 *  the geometry underneath is shared across every clone and stays put). */
function despawnLive(id) {
  const a = liveAgents.get(id)
  if (!a) return
  liveAgents.delete(id)
  const partner = director.clearContest(id)
  if (partner) endContestFor(a, partner)
  if (interaction) interaction.removeAgent(a)
  world.remove(a)
  Z.releaseSlots(id)
  scene.remove(a.root)
  a.root.traverse(n => {
    if (!n.isMesh && !n.isSkinnedMesh) return
    const mats = Array.isArray(n.material) ? n.material : [n.material]
    mats.forEach(m => m && m.dispose())
  })
  const mine = liveMeshes.get(id)
  if (mine) { for (const m of mine) { const i = meshes.indexOf(m); if (i >= 0) meshes.splice(i, 1) } }
  liveMeshes.delete(id)
  if (a.badge.material.map) a.badge.material.map.dispose()
  a.badge.material.dispose()
  a.halo.geometry.dispose()
  a.halo.material.dispose()
}

function endContestFor(a, partnerId) {
  const b = liveAgents.get(partnerId)
  const enc = world.encounters.find(e => e.kind === 'contest' &&
    (e.a === a || e.b === a || e.a === b || e.b === b))
  if (enc) world.resolveContest(enc)
}

/** One presence frame, applied: spawn if new, route to the zone the real
 *  verb/path maps to (zones.js's zoneFor, not a script), share a slot for
 *  rung 0 co-location or same-human clustering, and hand rung 3 off to
 *  World.contest() for the real collision animation instead of a scripted one. */
function onLivePresence(msg) {
  const now = Date.now()
  const info = director.onPresence(msg, now)
  const a = liveAgents.get(info.id) || spawnLive(info.id, info.human)
  if (!a) return   // rig still loading; the next frame for this agent will spawn it

  if (info.contestWith) {
    const b = liveAgents.get(info.contestWith)
    if (b && !a.busy && !b.busy && director.contestPartner(info.id) == null) {
      director.markContest(info.id, info.contestWith)
      world.contest(a, b)
    }
    a.say(`${info.verb} ${info.path}`.trim(), 'blocked')
    a.setState('blocked')
    return
  }

  const resolved = director.clearContest(info.id)
  if (resolved) endContestFor(a, resolved)

  const tone = info.verb === 'edit' ? 'working' : 'ok'
  a.say(`${info.verb} ${info.path}`.trim(), tone)
  a.setState(tone)
  if (!a.busy) {
    const slot = info.shareWith
      ? Z.claimSlot(info.zone, info.id, { share: info.shareWith })
      : Z.claimSlot(info.zone, info.id)
    a.goTo(slot.pos[0], slot.pos[1], { yaw: slot.yaw, label: info.zone })
  }
}

// The reel calls this "the two characters conflicting, THEN a highlight
// animation of how it resolved" — World.replay() is the sequencer that
// actually does both acts, chained through the same encounter phase
// machine every other paired action uses (see agent.js). `kind` here is
// the resolution kind straight off the event, which is also exactly the
// vocabulary World.replay() expects — no translation table needed. `a`/`b`
// follow the reel event's own sides throughout: "a is the one who stands
// down, b is the one who keeps going" — matching live.js's toReelEvent,
// where b is always the current lease holder. For generated events
// (seed.js, SAMPLE_EVENTS) there's no real winner encoded on the wire, so
// which side is a vs b there is arbitrary — fine for a demo replay, but
// not a claim about who actually deferred to whom.
//
// Kept local to replayEvent rather than imported from reel.js, same
// "small copy across the toolchain boundary" pattern live.js's HAIR/
// zones.js's PALETTE already use — this file doesn't import reel.js's
// internals and shouldn't start for one caption string.
const RESOLUTION_LABEL = {
  wait: 'granted the lease, other waits',
  abort: 'out-authoritied — aborted',
  share: 'split the work, no overlap',
  redundant: 'redundant work caught',
  'read-yield': 'reader yielded',
}

// ---- replay variant dispatch ---------------------------------------------
// A 'share' resolution can play as highfive (the only one that shipped in
// earlier rounds) or, once the clip pair land, chestbump/fistbump; an
// 'abort' resolution can play as shove, waveoff, or slap. Every non-base
// name is a `typeof world.X === 'function'` check away from a silent
// fallback to the base beat, so this dispatch degrades cleanly whether or
// not those clips have landed yet in this tree — see office/STATE.md.
//
// world.replay(a, b, kind) is still the whole story for the base name of
// each family: it plays the two-act "clash, then resolution" chain
// (REPLAY_CHAINS in agent.js). A non-base variant instead calls the
// standalone World method directly (world.chestbump(a, b), etc.) — those
// are already complete, self-contained beats with their own approach and
// contact (same shape as world.highfive/world.shove), so this trades the
// leading clash stage for the alternate contact animation rather than
// trying to splice a new stage into REPLAY_CHAINS from outside agent.js.
const SHARE_VARIANTS = ['highfive', 'chestbump', 'fistbump']
const ABORT_VARIANTS = ['shove', 'waveoff', 'slap']
const replayPlayCounts = new Map()   // event id -> times replayed, for the cycle-on-repeat rule

/** Small deterministic string hash (FNV-1a-ish) — good enough to spread
 *  event ids across a handful of variants without pulling in a dependency
 *  for it. Not cryptographic, doesn't need to be. */
function hashStr(s) {
  let h = 2166136261
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) }
  return h >>> 0
}

/** Which World method should play this resolution's beat: honors
 *  ?beat=<name> if it names a function that actually exists on `world`;
 *  otherwise cycles deterministically through whichever variants in the
 *  family exist, keyed by event id + how many times this exact event has
 *  been replayed this session (so clicking replay twice in a row on the
 *  same row shows a different take, but reloading the page and clicking
 *  once always shows the same first take for a given id). Returns null
 *  for a kind with no variant family (wait, redundant, read-yield all
 *  still just go through world.replay unconditionally). */
function pickReplayVariant(kind, eventId) {
  const family = kind === 'share' ? SHARE_VARIANTS : kind === 'abort' ? ABORT_VARIANTS : null
  if (!family) return null

  const forced = new URLSearchParams(location.search).get('beat')
  if (forced && family.includes(forced) && typeof world[forced] === 'function') return forced

  const available = family.filter(name => name === family[0] || typeof world[name] === 'function')
  const n = replayPlayCounts.get(eventId) || 0
  replayPlayCounts.set(eventId, n + 1)
  return available[hashStr(`${eventId}:${n}`) % available.length]
}

/** Click a reel row: caption who it was, then run the two-act replay — the
 *  clash, then the beat that actually resolved it — through
 *  World.replay() (or a direct variant call, see pickReplayVariant above),
 *  with the camera easing in to frame the pair and back out once the whole
 *  chain finishes (see the camera block above, focusPair/
 *  releaseCameraFocus, and the render-loop check that calls the latter).
 *  A click never silently no-ops: a rung-0 event (resolution: null), a
 *  pair not currently on screen (live frames often only know one side —
 *  see toReelEvent's own comment, that's honest, not a bug), or a pair
 *  where either side is already mid-beat all caption instead, rather than
 *  doing nothing. */
function replayEvent(e) {
  const who = (s) => (s.human || s.agent) ? `${s.human || '?'}/${s.agent || '?'}` : 'an unnamed agent'
  const pair = `${who(e.a)} vs ${who(e.b)}`
  const a = agents.find(x => x.name === e.a.agent)
  const b = agents.find(x => x.name === e.b.agent)

  if (!a || !b || a === b) {
    caption(`replay: ${pair} — not both on screen right now`)
    return
  }
  if (!e.resolution) {
    caption(`replay: ${pair} — co-location, nothing to resolve`)
    return
  }
  if (a.busy || b.busy) {
    // Preempting a mid-beat encounter cleanly would mean tearing another
    // pair's animation down without leaving either of THEM stuck — not
    // attempted here, see STATE.md. This still never silently no-ops.
    caption(`can't replay right now — ${a.busy ? a.name : b.name} is busy`)
    return
  }

  const kind = e.resolution.kind
  const variant = pickReplayVariant(kind, e.id)
  const isBaseVariant = variant === null ||
    (kind === 'share' && variant === 'highfive') || (kind === 'abort' && variant === 'shove')
  // A direct (non-chained) variant call skips world.replay()'s own arg
  // convention and goes straight to the standalone World method, which
  // for the abort family expects (winner, loser) — the opposite order
  // from the reel's own a=stands-down/b=prevails convention this function
  // uses throughout. Share's family is symmetric, so no swap needed there.
  const enc = isBaseVariant ? world.replay(a, b, kind)
    : kind === 'abort' ? world[variant](b, a) : world[variant](a, b)
  if (!enc) {
    caption(`replay: ${pair} — no matching beat for "${kind}"`)
    return
  }

  const label = RESOLUTION_LABEL[kind] || kind
  const token = captionArbiter.hold(PRIORITY.replay)
  replayCaptionToken = token
  // With a versus card on (?vcard=split|strip) it IS the replay caption —
  // the plain #caption line and the card sit at the same fixed bottom-
  // center spot, so leaving #caption's text set too doubled up as two
  // stacked, overlapping captions (found in the browser, round 7
  // integration). Writing '' still takes the hold at replay priority
  // (still blocks the demo's own captions per #63) but text.toggle('on',
  // false) on an empty string is what actually hides the plain line —
  // see caption.js's write callback in office.html.
  captionArbiter.set(replayCard.variant ? '' : `replay: ${pair} — ${label}`,
    { priority: PRIORITY.replay })
  replayCard.show({ a: e.a, b: e.b, rung: e.rung, label })
  focusPair(a, b, enc)
}

/** A negotiate/claim_result/redundant_work frame, normalized by
 *  live.js's toReelEvent and dropped straight into the reel as a
 *  source:'live' row. Presence frames used to be the only thing that drove
 *  the scene — this is the other half of #60: if the frame resolves a
 *  contest we're actively tracking (LiveDirector.resolutionFor matches it
 *  back to an active pair by holder/handover identity, since the wire never
 *  says who "self" is), drive the real beat too, not just the panel row —
 *  handshake for a "wait" verdict, shove for an "abort". A frame that
 *  resolutionFor can't match to a tracked pair still reaches the reel (the
 *  panel is honest either way); it just changes nothing in the 3D scene,
 *  same as before this fix. */
function onLiveReelFrame(msg) {
  const res = director.resolutionFor(msg)
  const requester = res ? { agent: res.loserId, human: director.humanOf(res.loserId) } : null
  const ev = Live.toReelEvent(msg, Date.now(), requester)
  if (ev) { reelStore.add(ev); reel.render() }

  if (!res) return
  const partner = director.clearContest(res.winnerId)
  const winner = liveAgents.get(res.winnerId)
  const loser = liveAgents.get(res.loserId)
  if (winner && loser) {
    const enc = world.encounters.find(e => e.kind === 'contest' &&
      (e.a === winner || e.b === winner || e.a === loser || e.b === loser))
    if (enc) world.resolveContest(enc)
    if (res.kind === 'wait') world.handshake(winner, loser)
    else world.shove(winner, loser)
  } else if (partner) {
    // One side isn't a live character right now (despawned mid-contest, or
    // this viewer's own presence view never spawned it) — nothing to play
    // a resolution beat between, but still drop the standoff pose rather
    // than leave it looping on whichever side is here.
    const solo = winner || loser
    if (solo) endContestFor(solo, partner)
  }
}

function expireLive(now) {
  for (const id of director.expire(now)) despawnLive(id)
}

function goLive() {
  liveMode = true
  setMode('live', `live · room ${new URLSearchParams(location.search).get('room') || '(default)'}`)
}

function goDemoFallback(reason) {

function initLive() {
  const room = new URLSearchParams(location.search).get('room') ?? ''
  const human = new URLSearchParams(location.search).get('human') ?? ''
  fallbackTimer = setTimeout(() => goDemoFallback(`no relay at ${Live.RELAY_URL}`), LIVE_TIMEOUT_MS)
  liveConn = Live.connect({
    room, human,
    onOpen: () => { clearTimeout(fallbackTimer); goLive() },
    onClose: () => { clearTimeout(fallbackTimer); goDemoFallback('relay unreachable') },
    onPresence: onLivePresence,

  })

}

// ---- demo -------------------------------------------------------------
let demo = null
// Routed through captionArbiter at demo priority — see #63 above. A
// replay hold (higher priority) simply drops these while it's active;
// this function's own signature and every existing call site are
// unchanged, so this is a transparent swap.
function caption(text) {
  captionArbiter.set(text, { priority: PRIORITY.demo })
}
function startDemo() {
  if (demo) demo.cancel()
  if (agents.length < 5 || !props.tortoise) { caption('still loading'); return }
  spin = false; setB(bSpin, false)
  bDemo.textContent = 'Restart demo'
  world.greetings = false; setB(bGreet, false)   // the demo scripts its own
  let n = 0
  demo = runDemo({
    agents, world, tortoise: props.tortoise, scene, caption, focus, zoneUI,
    onBeat: (t) => { n++; reel.setFoot(`beat <b>${n}</b> / 6`) },
  })
  window.__demo = demo
  // Capture the run. A cancelled run still settles, and without this check its
  // handler switched greetings back on underneath the run that replaced it —
  // which then hijacked the cast into spontaneous high fives mid-story.
  const run = demo
  demo.promise.then(r => {
    if (demo !== run) return
    reel.setFoot(`demo <b>${r}</b>`)
    world.greetings = true; setB(bGreet, true)
  })
}
bDemo.onclick = startDemo

/**
 * Slide each desk chair between its tucked and pulled-out marks.
 *
 * A desk's standing mark and its sitting position are nearly the same spot, so
 * a chair cannot sit correctly under a seated figure AND stay clear of a
 * standing one. Moving it is the only honest fix: tucked by default, and pulled
 * out under whoever is actually sitting there.
 */
function updateChairs(dt) {
  const dressing = window.__dressing
  if (!dressing || !dressing.deskChairs) return
  const k = 1 - Math.pow(0.002, dt)        // ~0.2 s to settle
  for (const label in dressing.deskChairs) {
    const c = dressing.deskChairs[label]
    const d = desks.find(x => x.label === label)
    if (!d) continue
    // Someone counts as at this desk if they are seated and near its seat.
    const taken = world.agents.some(a => a.seated &&
      Math.hypot(a.pos.x - d.seat[0], a.pos.z - d.seat[1]) < 0.55)
    const m = taken ? c.out : c.tuck
    c.group.position.x += (m.x - c.group.position.x) * k
    c.group.position.z += (m.z - c.group.position.z) * k
  }
}

function resize(){
  const w=canvas.clientWidth,h=canvas.clientHeight
  if(canvas.width!==w||canvas.height!==h){
    renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix() }
}

const clock = new THREE.Clock()
function tick(){
  resize()
  const dt = Math.min(clock.getDelta(), 0.05)

  if(spin){ yaw += 0.0016*spinDir
    if(yaw>YAW_MAX){ yaw=YAW_MAX; spinDir=-1 }
    if(yaw<YAW_MIN){ yaw=YAW_MIN; spinDir=1 } }

  if (goal.active) {
    const k = 1 - Math.pow(0.0015, dt)
    target.lerp(goal.target, k)
    dist += (goal.dist - dist) * k
    yaw += (goal.yaw - yaw) * k
  }

  world.update(dt)
  updateChairs(dt)
  expireLive(Date.now())
  if (demo) demo.update(dt)
  if (interaction) interaction.paint()

  // A replay's whole chain (clash, then resolution) can be one stage or
  // two, so this watches the encounter itself rather than a fixed timer —
  // world.update() above already advanced it this frame, so `phase` is
  // current. #end() only removes it from world.encounters, it doesn't
  // stop being an object, so the reference here stays valid to check.
  if (replayEnc && replayEnc.phase === 'done') {
    releaseCameraFocus()
    captionArbiter.release(replayCaptionToken)
    replayCaptionToken = null
    replayCard.hide()
  }

  const r = RADIUS*dist, cp = Math.cos(pitch)
  camera.position.set(target.x + Math.sin(yaw)*r*cp,
                      target.y + Math.sin(pitch)*r,
                      target.z + Math.cos(yaw)*r*cp)
  camera.lookAt(target)
  renderer.render(scene,camera)
  requestAnimationFrame(tick)
}
tick()

// ---- test surface -----------------------------------------------------
window.__scene = scene
window.__cam = camera
window.__renderer = renderer
window.__THREE = THREE
window.__world = world
window.__agents = world.agents     // all eight
window.__cast = agents             // the five the demo drives
window.__extras = extras
window.__desks = desks
window.__props = props
window.__pairUp = pairUp
// Scripted clicking, so the raycast path itself is what gets tested.
window.__clickAt = (x,y) => { const p = interaction.click(x,y); return p ? {kind:p.kind, label:p.label} : null }
window.__clickFloor = (x,z) => { const [sx,sy] = interaction.project(x,z); return window.__clickAt(sx,sy) }
window.__clickAgent = id => {
  const a = world.byId(id); if (!a) return null
  const [sx,sy] = interaction.project(a.pos.x, a.pos.z)
  return window.__clickAt(sx, sy - 40)          // aim at the torso, not the feet
}
window.__hoverAt = (x,y) => interaction.hoverAt(x,y)
window.__selected = () => interaction.selected ? interaction.selected.id : null
window.__zones = Z
window.__zoneUI = zoneUI
window.__anim = ANIM
window.__startDemo = startDemo
window.__caption = () => capEl.textContent
window.__live = { director, liveAgents, mode: () => (liveMode ? 'live' : 'demo'), onPresence: onLivePresence }
window.__focus = focus
window.__setCam = (y,p,d) => { goal.active=false; yaw=y; pitch=p; dist=d }
window.__agentState = () => world.agents.map(a => ({
  ...a.describe(),
  note: a.note || null,
  zone: Z.zoneAt(a.pos.x, a.pos.z),
}))
</script>
</body>
