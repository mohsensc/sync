<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clip test — clay rig</title>
<style>
  html,body{margin:0;height:100%;background:#F0ECE6;overflow:hidden;
    font:14px/1.5 ui-sans-serif,-apple-system,Segoe UI,sans-serif;color:#35455C}
  #c{display:block;width:100%;height:100%;cursor:grab}
  #c:active{cursor:grabbing}
  #hud{position:fixed;left:18px;top:16px;background:#fffdfaee;border:1px solid #C3B39B;
    border-radius:10px;padding:12px 14px;max-width:320px;box-shadow:0 6px 24px #4a1f3d18}
  #hud h1{font-size:15px;margin:0 0 3px;letter-spacing:-.01em}
  #hud p{margin:0 0 10px;font-size:12px;color:#6b5f56}
  .row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  button{font:inherit;font-size:12px;padding:5px 10px;border-radius:6px;
    border:1px solid #C3B39B;background:#fff;color:#35455C;cursor:pointer}
  button:hover{background:#E9E0CE}
  button[aria-pressed="true"]{background:#35455C;color:#F0ECE6;border-color:#35455C}
  #now{position:fixed;left:50%;top:18px;transform:translateX(-50%);
    font:600 22px ui-monospace,monospace;color:#4A1F3D;background:#fffdfacc;
    padding:6px 18px;border-radius:8px;letter-spacing:.02em}
  #log{position:fixed;left:18px;bottom:16px;font:11px ui-monospace,monospace;color:#6b5f56;
    background:#fffdfacc;border-radius:8px;padding:7px 10px;max-width:70vw;white-space:pre}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="now">loading</div>
<div id="hud">
  <h1>Clip test</h1>
  <p>One character, every clip. Drag to orbit, scroll to zoom.</p>
  <div class="row" id="clips"></div>
  <div class="row">
    <button id="bPair" aria-pressed="false">Pair (high five)</button>
    <button id="bSlow" aria-pressed="false">Half speed</button>
    <button id="bGrid" aria-pressed="true">Floor</button>
  </div>
</div>
<div id="log">loading…</div>

<script type="importmap">
{"imports":{"three":"../../public/vendor/three.module.js","three/addons/":"../../public/vendor/addons/"}}
</script>
<script type="module">
import * as THREE from 'three'
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'
import { clone as skinnedClone } from 'three/addons/utils/SkeletonUtils.js'
import * as ANIM from './anim.js'
import * as HF from './highfive.js'

const canvas = document.getElementById('c')
const logEl = document.getElementById('log')
const nowEl = document.getElementById('now')

const renderer = new THREE.WebGLRenderer({ canvas, antialias:true })
renderer.setPixelRatio(Math.min(devicePixelRatio,2))
renderer.shadowMap.enabled = true
renderer.shadowMap.type = THREE.PCFSoftShadowMap

const scene = new THREE.Scene()
scene.background = new THREE.Color(0xF0ECE6)
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100)

scene.add(new THREE.AmbientLight(0xffffff, 0.95))
const key = new THREE.DirectionalLight(0xfff0d8, 2.0)
key.position.set(4, 7, 6); key.castShadow = true
key.shadow.mapSize.set(2048,2048)
Object.assign(key.shadow.camera, { left:-4, right:4, top:5, bottom:-2, near:0.5, far:25 })
scene.add(key)
const fill = new THREE.DirectionalLight(0xd6e0f0, 0.5); fill.position.set(-5,4,-4); scene.add(fill)

const floor = new THREE.Mesh(new THREE.BoxGeometry(14, 0.3, 14),
  new THREE.MeshStandardMaterial({ color:0xE9E0CE, roughness:1 }))
floor.position.y = -0.15; floor.receiveShadow = true; scene.add(floor)
// A seat block so the sit/type/sleep poses can be judged against something real.
const stool = new THREE.Mesh(new THREE.BoxGeometry(0.44,0.45,0.44),
  new THREE.MeshStandardMaterial({ color:0xC3B39B, roughness:1 }))
stool.position.set(0,0.225,-0.16); stool.castShadow = true; stool.receiveShadow = true
stool.visible = false; scene.add(stool)
const desk = new THREE.Mesh(new THREE.BoxGeometry(1.2,0.05,0.6),
  new THREE.MeshStandardMaterial({ color:0xD8BDB6, roughness:1 }))
desk.position.set(0,0.74,0.42); desk.castShadow = true; desk.receiveShadow = true
desk.visible = false; scene.add(desk)

const CHAR_H = 1.68
const chars = []
let clock = new THREE.Clock()
let currentName = 'idle', slow = false, pairMode = false

function place(src, x, rotY) {
  const o = skinnedClone(src)
  // A fresh clone has stale world matrices; Box3 reads a degenerate height and
  // the scale explodes to ~99x if you measure before this.
  o.updateMatrixWorld(true)
  const box = new THREE.Box3().setFromObject(o)
  const size = box.getSize(new THREE.Vector3())
  const c = box.getCenter(new THREE.Vector3())
  const s = CHAR_H / Math.max(size.y, 1e-4)
  const g = new THREE.Group()
  o.position.set(-c.x, -box.min.y, -c.z)
  g.add(o); g.scale.setScalar(s)
  g.position.set(x, 0, 0); g.rotation.y = rotY
  o.traverse(n => { if (n.isMesh) { n.castShadow = true; n.receiveShadow = true } })
  scene.add(g)
  return { group:g, root:o, scale:s }
}

// ---- wrist axis overlay -----------------------------------------------------
// ?axes=1 draws, on each hand, the three vectors the wrist poses are written
// against: where the fingers point, where the palm faces, and the forearm's own
// long axis (the one a wrist may NOT rotate about).
const axesOn = new URLSearchParams(location.search).has('axes')
const arrows = []
function buildAxes(root, scale) {
  if (!axesOn) return
  for (const side of ['Left', 'Right']) {
    const hand = root.getObjectByName(side + 'Hand')
    const fore = root.getObjectByName(side + 'ForeArm')
    const L = 0.13
    const mk = c => { const a = new THREE.ArrowHelper(new THREE.Vector3(0,1,0), new THREE.Vector3(), L, c, L*0.3, L*0.2); scene.add(a); return a }
    arrows.push({ hand, fore, side,
      fingers: mk(0x35455C), palm: mk(0xD9714F), twist: mk(0xD6B45C) })
  }
}
const _p = new THREE.Vector3(), _q = new THREE.Quaternion(), _s = new THREE.Vector3(), _d = new THREE.Vector3()
function updateAxes() {
  for (const a of arrows) {
    a.hand.matrixWorld.decompose(_p, _q, _s)
    a.fingers.position.copy(_p); a.fingers.setDirection(_d.set(0,1,0).applyQuaternion(_q))
    a.palm.position.copy(_p); a.palm.setDirection(_d.copy(ANIM.PALM_NORMAL[a.side + 'Hand']).applyQuaternion(_q))
    a.fore.matrixWorld.decompose(_p, _q, _s)
    a.twist.position.copy(_p); a.twist.setDirection(_d.set(0,1,0).applyQuaternion(_q))
  }
}

const loader = new GLTFLoader()
loader.load('../../public/glb/character.glb', gltf => {
  chars.push(place(gltf.scene, 0, 0))
  chars.push(place(gltf.scene, 1.05, 0))
  chars[1].group.visible = false
  buildAxes(chars[0].root, chars[0].scale)
  buildButtons()
  play('idle')
  applyQuery()
  window.__ready = true
  report()
}, undefined, e => { logEl.textContent = 'load failed: ' + e })

// ?clip=wave&t=0.25&yaw=..&pitch=..&dist=..&tx=..&ty=..&tz=..&bind=1
// t is a fraction of the clip, so a screenshot can be aimed at one frame.
function applyQuery() {
  const q = new URLSearchParams(location.search)
  const num = (k, d) => q.has(k) ? parseFloat(q.get(k)) : d
  if (q.has('bind')) {
    const zero = {}; for (const b of ANIM.BONES) zero[b] = [0, 0, 0]
    ANIM.dispose(chars[0].root)
    ANIM.applyPose(chars[0].root, zero)
    nowEl.textContent = 'bind'
    window.__frozen = true
  } else if (q.has('clip')) {
    play(q.get('clip'))
    if (q.has('t')) { freezeAt(num('t', 0)); window.__frozen = true }
  }
  yaw = num('yaw', yaw); pitch = num('pitch', pitch); dist = num('dist', dist)
  target.set(num('tx', 0), num('ty', 0.85), num('tz', 0))
  if (q.has('follow')) followBone = q.get('follow')
}
let followBone = null

// Park the rig on one frame of the current clip. Stop everything first: play()
// crossfades, so the outgoing action is still at full weight and pausing the
// incoming one on its own renders a blend of the two, not the frame asked for.
function freezeAt(frac) {
  const root = chars[0].root
  ANIM.getMixer(root).stopAllAction()
  const a = ANIM.makeAction(root, currentName)
  a.reset(); a.enabled = true; a.setEffectiveWeight(1); a.play(); a.paused = true
  a.time = frac * a.getClip().duration
  ANIM.update(root, 0)
  root.updateMatrixWorld(true)
  return a
}

function play(name) {
  currentName = name
  nowEl.textContent = name
  ANIM.crossfade(chars[0].root, name, 0.3)
  if (chars[1]) {
    // Both play the SAME clip. Facing each other is the mirror; the mirrored
    // clip would pair a right hand with a left one. See highfive.js.
    ANIM.crossfade(chars[1].root, name, 0.3)
    // Restart both from zero so the paired contact frames line up.
    if (name === 'highfive') {
      ANIM.makeAction(chars[0].root,'highfive').time = 0
      ANIM.makeAction(chars[1].root,'highfive').time = 0
    }
  }
  const seated = ANIM.SEATED_CLIPS.has(name)
  stool.visible = seated; desk.visible = seated
  document.querySelectorAll('#clips button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.n === name)))
  report()
}

function buildButtons() {
  const wrap = document.getElementById('clips')
  ANIM.CLIP_NAMES.forEach(n => {
    const b = document.createElement('button')
    b.textContent = n; b.dataset.n = n
    b.onclick = () => play(n)
    wrap.appendChild(b)
  })
}

document.getElementById('bPair').onclick = e => {
  pairMode = !pairMode
  e.target.setAttribute('aria-pressed', String(pairMode))
  chars[1].group.visible = pairMode
  // Face them at each other for the high five.
  // On the mark, not eyeballed: the clip only makes contact at this one gap.
  chars[1].group.rotation.y = pairMode ? Math.PI : 0
  chars[1].group.position.x = pairMode ? HF.HIGHFIVE_SPACING : 1.05
  play(currentName)
}
document.getElementById('bSlow').onclick = e => {
  slow = !slow; e.target.setAttribute('aria-pressed', String(slow))
}
document.getElementById('bGrid').onclick = e => {
  floor.visible = !floor.visible; e.target.setAttribute('aria-pressed', String(floor.visible))
}

// ---- measurement, so the poses can be asserted on and not just eyeballed ----
const _v = new THREE.Vector3()
function boneY(i, name) {
  const b = chars[i].root.getObjectByName(name)
  if (!b) return null
  b.updateMatrixWorld(true)
  return _v.setFromMatrixPosition(b.matrixWorld).clone()
}
window.__probe = (name) => {
  const o = {}
  for (const n of ['Hips','Head','LeftHand','RightHand','LeftFoot','RightFoot','LeftToeBase','RightToeBase','Spine'])
    o[n] = boneY(0, n).toArray().map(v => +v.toFixed(3))
  return o
}
window.__scene = scene
window.__chars = chars
window.__anim = ANIM
window.__camera = camera
window.__arrows = arrows
window.__view = (o) => { if (o.yaw!=null) yaw=o.yaw; if (o.pitch!=null) pitch=o.pitch
  if (o.dist!=null) dist=o.dist; if (o.follow!==undefined) followBone=o.follow
  if (o.target) target.set(...o.target) }
window.__play = play
window.__clipName = () => currentName
window.__setTime = (t) => freezeAt(t / ANIM.getClip(currentName).duration)
window.__freezeAt = freezeAt
window.__resume = () => { ANIM.makeAction(chars[0].root, currentName).paused = false }

function report() {
  if (!chars.length) return
  const p = window.__probe()
  logEl.textContent =
    `${currentName}  hips.y=${p.Hips[1].toFixed(3)}  head.y=${p.Head[1].toFixed(3)}\n` +
    `Lfoot=[${p.LeftFoot.join(',')}]  Rfoot=[${p.RightFoot.join(',')}]\n` +
    `Lhand=[${p.LeftHand.join(',')}]  Rhand=[${p.RightHand.join(',')}]`
}
setInterval(report, 250)

// ---- camera ----
let yaw = 0.62, pitch = 0.18, dist = 1
let drag=false, px=0, py=0
canvas.addEventListener('pointerdown', e => { drag=true; px=e.clientX; py=e.clientY })
addEventListener('pointerup', () => drag=false)
addEventListener('pointermove', e => {
  if(!drag) return
  yaw -= (e.clientX-px)*0.006
  pitch = Math.max(-0.2, Math.min(1.2, pitch + (e.clientY-py)*0.005))
  px=e.clientX; py=e.clientY
})
canvas.addEventListener('wheel', e => { e.preventDefault()
  dist = Math.max(0.3, Math.min(2.5, dist + e.deltaY*0.0012)) }, {passive:false})
window.__cam = (y,p,d) => { yaw=y; pitch=p; dist=d }

function resize(){
  const w=canvas.clientWidth,h=canvas.clientHeight
  if(canvas.width!==w||canvas.height!==h){
    renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix() }
}
const target = new THREE.Vector3(0, 0.85, 0)
const _t = new THREE.Vector3()
function tick(){
  resize()
  const dt = clock.getDelta() * (slow ? 0.5 : 1)
  if (!window.__frozen) for (const c of chars) ANIM.update(c.root, dt)
  if (chars.length) chars[0].root.updateMatrixWorld(true)
  updateAxes()
  if (followBone && chars.length) {
    const b = chars[0].root.getObjectByName(followBone)
    if (b) target.copy(_t.setFromMatrixPosition(b.matrixWorld))
  } else if (pairMode) target.x = HF.HIGHFIVE_SPACING * 0.5
  const r = 4.2*dist, cp = Math.cos(pitch)
  camera.position.set(target.x + Math.sin(yaw)*r*cp, target.y + Math.sin(pitch)*r, target.z + Math.cos(yaw)*r*cp)
  camera.lookAt(target)
  renderer.render(scene,camera)
  requestAnimationFrame(tick)
}
tick()
</script>
</body>
</html>
