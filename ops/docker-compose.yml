# `docker compose up` from this directory: Prometheus scraping gorelay,
# Grafana with the dashboard and datasource already provisioned. Two
# services, both free, both self-hosted — no account anywhere, nothing to
# sign up for. The relay itself is not a service here: run it yourself
# (`gorelay --metrics-addr=0.0.0.0:9830`) the way an operator actually
# would. See docs/monitoring.md.
services:
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9831:9090"
    extra_hosts:
      # host.docker.internal is automatic on Docker Desktop; this line is
      # what makes it resolve on Linux too.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/agent-presence.json:/var/lib/grafana/dashboards/agent-presence.json:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "9832:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
