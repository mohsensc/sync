name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# Three jobs, one per language. No `continue-on-error`, no `if:` guards on any
# step: a toolchain that isn't there has to turn the check red, not skip it.

jobs:
  python:
    name: python
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # the floor in pyproject; test what we claim

      - name: preflight
        run: |
          set -euo pipefail
          python -c 'import sys; assert sys.version_info >= (3, 12), sys.version'
          python --version

      - name: install with dev extras
        working-directory: python
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -c 'import pytest, hypothesis'

      - name: pytest
        working-directory: python
        # -m pytest, not bare pytest: sim/ only imports with cwd on sys.path.
        # pytest exits 5 when it collects nothing, so an empty run is still red.
        run: |
          set -euo pipefail
          python -m pytest -q

  cpp:
    name: cpp
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: install compiler, cmake and openssl
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ cmake libssl-dev

      - name: preflight
        run: |
          set -euo pipefail
          for t in g++ cmake ctest; do
            command -v "$t" >/dev/null || { echo "error: $t is not on PATH"; exit 1; }
          done
          test -f /usr/include/openssl/sha.h || {
            echo "error: OpenSSL headers missing; libssl-dev did not install"; exit 1; }
          g++ --version | head -1
          cmake --version | head -1

      - name: configure
        # Catch2 isn't on the runner, so CMake FetchContents the pinned v3.5.2.
        run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release

      - name: build
        run: cmake --build cpp/build -j"$(nproc)"

      - name: ap_tests
        run: ./cpp/build/ap_tests

      - name: ctest
        # --no-tests=error because plain ctest prints "No tests were found!!!"
        # and exits 0. That is the green-check-that-ran-nothing case.
        run: ctest --test-dir cpp/build --output-on-failure --no-tests=error

  web:
    name: web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # pnpm before setup-node: the node cache: pnpm needs pnpm on PATH.
      # The repo's lockfile is pnpm-lock.yaml, so `npm ci` has nothing to read.
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: install
        working-directory: web
        # --frozen-lockfile: resolve exactly what's locked or fail. This is what
        # pins vitest to 2.1.9 and typescript to 5.9.3.
        run: pnpm install --frozen-lockfile

      - name: verify toolchain
        working-directory: web
        # Asserts node_modules/.bin/{vitest,tsc} exist and match the lockfile.
        # `npx vitest` fetched 4.1.10 over the pinned 2.1.9, and `npx tsc`
        # fetches an unrelated package that prints "This is not the tsc command
        # you are looking for". Neither can reach the suite through here.
        run: pnpm run verify-toolchain

      - name: test
        working-directory: web
        # Via the script, so PATH starts at node_modules/.bin. Never bare npx.
        run: pnpm run test

      - name: typecheck
        working-directory: web
        run: pnpm run typecheck

      - name: assert typecheck actually read the sources
        working-directory: web
        # tsc --noEmit exits 0 just as happily on an include glob that matches
        # nothing. Every .ts in src/ and test/ has to show up in the file list.
        run: |
          set -euo pipefail
          on_disk=$(find src test -name '*.ts' | wc -l | tr -d ' ')
          checked=$(./node_modules/.bin/tsc --noEmit --listFilesOnly | grep -cv node_modules | tr -d ' ')
          echo "$checked of $on_disk project files typechecked"
          [ "$checked" -eq "$on_disk" ] || {
            echo "error: tsc read $checked files, $on_disk on disk; include globs are wrong"
            exit 1; }
