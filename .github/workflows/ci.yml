name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# One job per language. No `continue-on-error`, no `if:` guards on any
# step: a toolchain that isn't there has to turn the check red, not skip it.

jobs:
  python:
    name: python
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # the floor in pyproject; test what we claim

      # The relay is gorelay now (#40) — the black-box suite
      # (test_e2e.py, test_serve.py, test_relay_restart.py) spawns the
      # real binary as a subprocess (python/tests/helpers/gorelay_proc.py)
      # rather than driving a Python Relay object in-process, so this job
      # needs a Go toolchain to build it. This is the "gap is process, not
      # design" line from docs/languages.md's daemon<->relay seam note,
      # closed: cross-language relay verification now runs in CI, not
      # just by hand before a release.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod

      - name: preflight
        run: |
          set -euo pipefail
          python -c 'import sys; assert sys.version_info >= (3, 12), sys.version'
          python --version
          go version

      - name: build gorelay
        run: |
          set -euo pipefail
          cd go && go build -o bin/gorelay ./cmd/gorelay
          echo "AGENT_PRESENCE_GORELAY_BIN=$PWD/bin/gorelay" >> "$GITHUB_ENV"

      - name: install with dev extras
        working-directory: python
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -c 'import pytest, hypothesis, websockets'

      - name: pytest
        working-directory: python
        # -m pytest, not bare pytest: pytest exits 5 when it collects
        # nothing, so an empty run is still red.
        run: |
          set -euo pipefail
          python -m pytest -q

  cpp:
    name: cpp
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Just a compiler and cmake — the hook (all that's left in cpp/, see
      # #18) has never needed OpenSSL. That dependency belonged to the
      # daemon's room-key hashing, gone now that the daemon is Go's
      # crypto/sha256 (#21).
      - name: install compiler and cmake
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ cmake

      - name: preflight
        run: |
          set -euo pipefail
          for t in g++ cmake ctest; do
            command -v "$t" >/dev/null || { echo "error: $t is not on PATH"; exit 1; }
          done
          g++ --version | head -1
          cmake --version | head -1

      - name: configure
        # Catch2 isn't on the runner, so CMake FetchContents the pinned v3.5.2.
        run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release

      - name: build
        run: cmake --build cpp/build -j"$(nproc)"

      - name: ap_tests
        run: ./cpp/build/ap_tests

      - name: ctest
        # --no-tests=error because plain ctest prints "No tests were found!!!"
        # and exits 0. That is the green-check-that-ran-nothing case.
        run: ctest --test-dir cpp/build --output-on-failure --no-tests=error

  go:
    name: go
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod

      - name: preflight
        run: go version

      - name: vet
        working-directory: go
        run: go vet ./...

      - name: build
        working-directory: go
        run: go build ./...

      - name: test -race
        working-directory: go
        # #20's whole claim — no journal deadlock, no decision starvation —
        # is only worth anything if -race actually runs. #24 is what makes
        # that safe to run with -count=1 in CI: every test uses t.TempDir(),
        # so nothing here can collide with a parallel run on the runner.
        run: go test ./... -race -count=1

      - name: cross-compile every release target
        # #21: no toolchain beyond `go` itself, on every PR, not just at
        # release time. scripts/build-go-release.sh is the same script a
        # release build runs, so this is the real thing and not a parallel
        # check that can drift from it.
        run: bash scripts/build-go-release.sh "$RUNNER_TEMP/dist"

  web:
    name: web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # pnpm before setup-node: the node cache: pnpm needs pnpm on PATH.
      # The repo's lockfile is pnpm-lock.yaml, so `npm ci` has nothing to read.
      - uses: pnpm/action-setup@v4
        with:
          # 10.x, not 9.15.4. web/pnpm-workspace.yaml (bce8319) is a pnpm 10
          # file: it carries `allowBuilds: esbuild` and no `packages:` key,
          # and pnpm 9 rejects a workspace file without one — "packages field
          # missing or empty", before install does anything. So the pin was
          # what made this job red, not the lockfile. 10.x reads both the
          # workspace file and the lockfileVersion 9.0 lockfile unchanged.
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: install
        working-directory: web
        # --frozen-lockfile: resolve exactly what's locked or fail. This is what
        # pins vitest to 2.1.9 and typescript to 5.9.3.
        run: pnpm install --frozen-lockfile

      - name: verify toolchain
        working-directory: web
        # Asserts node_modules/.bin/{vitest,tsc} exist and match the lockfile.
        # `npx vitest` fetched 4.1.10 over the pinned 2.1.9, and `npx tsc`
        # fetches an unrelated package that prints "This is not the tsc command
        # you are looking for". Neither can reach the suite through here.
        run: pnpm run verify-toolchain

      - name: test
        working-directory: web
        # Via the script, so PATH starts at node_modules/.bin. Never bare npx.
        run: pnpm run test

      - name: typecheck
        working-directory: web
        run: pnpm run typecheck

      - name: assert typecheck actually read the sources
        working-directory: web
        # tsc --noEmit exits 0 just as happily on an include glob that matches
        # nothing. Every .ts in src/ and test/ has to show up in the file list.
        #
        # A subset check, not a count. Counting was equivalent right up until
        # test/gitapi.test.ts imported ../gitapi.mjs and pulled in
        # web/gitapi.d.mts — a file tsc legitimately reads and `find ... -name
        # '*.ts'` can't see, so the counts read 55 of 54 and the job went red
        # over a declaration file doing its job. What this step is defending is
        # "no project source went unchecked", which is the comm -23 below;
        # equal totals were only ever a proxy for it.
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          find src test -name '*.ts' | sort > "$tmp/on-disk"
          ./node_modules/.bin/tsc --noEmit --listFilesOnly |
            grep -v node_modules | sed "s|^$PWD/||" | sort > "$tmp/checked"
          echo "$(wc -l < "$tmp/checked" | tr -d ' ') files typechecked, \
$(wc -l < "$tmp/on-disk" | tr -d ' ') project files on disk"
          missing=$(comm -23 "$tmp/on-disk" "$tmp/checked")
          [ -z "$missing" ] || {
            echo "error: tsc never read these; include globs are wrong:"
            echo "$missing"
            exit 1; }
