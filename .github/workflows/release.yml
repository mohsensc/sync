name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: build and attach presenced binaries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod

      - name: cross-compile
        run: bash scripts/build-go-release.sh dist

      - name: attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/presenced-*
